[package]
name = "downloader"
version = "0.2.0"
edition = "2024"

[dependencies]
log = "0.4"
parking_lot = "0.12"
reqwest = "0.12"
url = "2.5.0"
urlencoding = "2.1.3"
content_disposition = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["fs", "rt", "time", "sync", "io-util"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
env_logger = "0.10"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
