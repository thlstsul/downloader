[package]
name = "downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.0"
crossbeam = "0.8"
futures = "0.3"
indicatif = "0.17"
log = "0.4"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
env_logger = "0.10"
